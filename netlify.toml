[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/u-s-market-entry"
  to = "/u-s-market-entry/"
  status = 301

[[redirects]]
  from = "/u-s-retailers-partners"
  to = "/u-s-retailers-partners/"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/about-us/"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/contact-us/"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
