<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00441b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Devmir | Connecting Global Manufacturing with U.S. Retail & E-Commerce</title>
    <meta
      name="description"
      content="Devmir connects established international manufacturers and brands with the U.S. retail and e-commerce market through market access, fulfillment, infrastructure, and local expertise."
    />
    <link rel="canonical" href="https://devmir.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Devmir" />
    <meta property="og:title" content="Devmir | Connecting Global Manufacturing with U.S. Retail & E-Commerce" />
    <meta
      property="og:description"
      content="Devmir connects established international manufacturers and brands with the U.S. retail and e-commerce market through market access, fulfillment, infrastructure, and local expertise."
    />
    <meta property="og:url" content="https://devmir.com/" />
    <meta property="og:image" content="https://devmir.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Devmir: Connecting Quality Manufacturing with the U.S. Market" />

    <meta name="twitter:image" content="https://devmir.com/og-default.jpg" />
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="audience">
        <option value="manufacturer">International Manufacturer or Brand</option>
        <option value="retailer">U.S. Retailer or Partner</option>
        <option value="other">Other</option>
      </select>
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
